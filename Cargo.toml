[workspace]
resolver = "3"
members = [
    "crates/itzma-core",
    "crates/itzma-store",
    "crates/itzma-python",
]
# itzma-python's test binary links libpython, so a plain `cargo test` or
# `cargo clippy` leaves it out. The py-* Makefile targets and CI's python job
# build it with PYO3_PYTHON pointing at py-itzma/.venv.
default-members = [
    "crates/itzma-core",
    "crates/itzma-store",
]

[workspace.package]
# The one version: both crates inherit it, maturin reads it for the Python
# package, and scripts/release.py bumps it.
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sergiommarcial/itzma"
# 1.87, not object_store's declared 1.85: yoke-derive (via url and icu) uses
# str::from_utf8, stable in 1.87, but declares no rust-version of its own.
rust-version = "1.87"

# One codegen unit and thin LTO let the distance kernels inline into
# their callers across crates. Debug and test builds are untouched.
[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
