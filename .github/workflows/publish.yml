name: Publish

# Builds and publishes one tagged version: itzma-core to crates.io, itzma to
# PyPI, then a GitHub Release with the wheels. The Release workflow starts
# this after it tags; a tag pushed by hand starts it too. Every publishing
# step skips what is already out, so a failed run can simply be run again
# with the same tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v0.2.0
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: tag matches the versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - id: version
        run: |
          python3 scripts/release.py check "$TAG"
          python3 scripts/release.py notes "$TAG" > /dev/null
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: the crate packages and builds on its own
        run: cargo publish --locked --dry-run -p itzma-core

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  wheels:
    name: wheel (${{ matrix.target }}, ${{ matrix.libc }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, libc: macos, smoke: true }
          - { os: macos-14, target: x86_64-apple-darwin, libc: macos }
          - { os: ubuntu-latest, target: x86_64, libc: manylinux, manylinux: auto, smoke: true }
          - { os: ubuntu-24.04-arm, target: aarch64, libc: manylinux, manylinux: auto, smoke: true }
          - { os: ubuntu-latest, target: x86_64, libc: musllinux, manylinux: musllinux_1_2, smoke-musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64, libc: musllinux, manylinux: musllinux_1_2 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: py-itzma
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out dist
      - name: the wheel installs and works
        if: matrix.smoke
        run: |
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet py-itzma/dist/*.whl
          /tmp/smoke/bin/python scripts/smoke.py
      - name: the wheel installs and works (Alpine)
        if: matrix.smoke-musl
        run: >
          docker run --rm -v "$PWD:/w" -w /w python:3.12-alpine
          sh -c "pip install --quiet py-itzma/dist/*.whl && python scripts/smoke.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-${{ matrix.libc }}-${{ matrix.target }}
          path: py-itzma/dist/*.whl
          if-no-files-found: error

  sdist:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: py-itzma
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdist
          path: py-itzma/dist/*.tar.gz
          if-no-files-found: error

  crates-io:
    needs: [verify, ci, wheels, sdist]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      # Only for the very first publish: crates.io's trusted publishing can
      # only be set up once the crate exists. Delete the secret afterwards.
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - id: published
        name: already on crates.io?
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -A 'itzma release (https://github.com/sergiommarcial/itzma)' \
            "https://crates.io/api/v1/crates/itzma-core/$VERSION")
          echo "done=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - id: auth
        if: steps.published.outputs.done == 'false' && env.HAS_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - if: steps.published.outputs.done == 'false'
        run: cargo publish --locked -p itzma-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}

  pypi:
    needs: crates-io
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py notes "$TAG" > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file notes.md
          fi
