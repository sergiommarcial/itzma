name: Publish

# Builds and publishes one tagged version: the Rust crates (itzma-core,
# itzma-store and the three store adapters) to crates.io, itzma to PyPI, then a GitHub Release with the wheels. The Release workflow starts
# this after it tags; a tag pushed by hand starts it too. Every publishing
# step skips what is already out, so a failed run can simply be run again
# with the same tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v0.2.0
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always
  # Every crate published to crates.io, all at the workspace version.
  CRATES: -p itzma-core -p itzma-store -p itzma-store-gcs -p itzma-store-azure -p itzma-store-aws

jobs:
  verify:
    name: tag matches the versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - id: version
        run: |
          python3 scripts/release.py check "$TAG"
          python3 scripts/release.py notes "$TAG" > /dev/null
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # One multi-package dry run, so the adapters resolve itzma-store from
      # this tree before it is on crates.io.
      - name: the crates package and build on their own
        run: cargo publish --locked --dry-run ${{ env.CRATES }}

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  wheels:
    name: wheel (${{ matrix.target }}, ${{ matrix.libc }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin, libc: macos, smoke: true }
          - { os: macos-15, target: x86_64-apple-darwin, libc: macos }
          - { os: ubuntu-latest, target: x86_64, libc: manylinux, manylinux: auto, smoke: true }
          - { os: ubuntu-24.04-arm, target: aarch64, libc: manylinux, manylinux: auto, smoke: true }
          - { os: ubuntu-latest, target: x86_64, libc: musllinux, manylinux: musllinux_1_2, smoke-musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64, libc: musllinux, manylinux: musllinux_1_2 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: py-itzma
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out dist
      - name: the wheel installs and works
        if: matrix.smoke
        run: |
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet py-itzma/dist/*.whl
          /tmp/smoke/bin/python scripts/smoke.py
      - name: the wheel installs and works (Alpine)
        if: matrix.smoke-musl
        run: >
          docker run --rm -v "$PWD:/w" -w /w python:3.12-alpine
          sh -c "pip install --quiet py-itzma/dist/*.whl && python scripts/smoke.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.libc }}-${{ matrix.target }}
          path: py-itzma/dist/*.whl
          if-no-files-found: error

  sdist:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: py-itzma
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: py-itzma/dist/*.tar.gz
          if-no-files-found: error

  crates-io:
    needs: [verify, ci, wheels, sdist]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      # Only for a crate's very first publish: crates.io's trusted publishing
      # can only be set up once the crate exists. Delete the secret afterwards.
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - id: published
        name: which crates are not on crates.io yet
        run: |
          todo=""
          for flag in $CRATES; do
            [ "$flag" = -p ] && continue
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -A 'itzma release (https://github.com/sergiommarcial/itzma)' \
              "https://crates.io/api/v1/crates/$flag/$VERSION")
            [ "$code" = 200 ] || todo="$todo -p $flag"
          done
          echo "todo=$todo" >> "$GITHUB_OUTPUT"
      - id: auth
        if: steps.published.outputs.todo != '' && env.HAS_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      # One command, so cargo publishes itzma-store before the adapters that
      # depend on it.
      - if: steps.published.outputs.todo != ''
        run: cargo publish --locked ${{ steps.published.outputs.todo }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}

  pypi:
    needs: crates-io
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py notes "$TAG" > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file notes.md
          fi
