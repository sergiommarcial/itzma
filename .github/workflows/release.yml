name: Release

# Start from the Actions tab: bumps the version everywhere, turns the
# CHANGELOG's [Unreleased] section into the version's notes, commits, tags
# vX.Y.Z, pushes both, and starts Publish for the tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: patch, minor, major, or an exact version such as 0.2.0
        required: true
        default: patch

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - id: bump
        name: bump the version and cut the changelog
        env:
          BUMP: ${{ inputs.version }}
        run: |
          version=$(python3 scripts/release.py prepare "$BUMP")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: the lockfiles still agree
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          uv lock --check --directory py-itzma
      - name: commit, tag and push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml crates/itzma-python/Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "releasing v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"
      # A push made with the workflow's own token starts no workflows, so
      # Publish is started explicitly (dispatch is the one exception).
      - name: start Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh workflow run publish.yml --ref main -f tag="v$VERSION"
