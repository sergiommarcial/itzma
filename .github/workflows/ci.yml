name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # New advisories land without any code change, so re-check weekly.
    - cron: "0 6 * * 1"
  # publish.yml runs the whole suite against the release tag before it
  # publishes anything.
  workflow_call:
    inputs:
      ref:
        description: The tag or commit to check out
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - uses: astral-sh/setup-uv@v6
      - name: release script tests
        run: make release-test
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: rustdoc
        run: cargo doc --locked --no-deps -p itzma-core
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.87 is the rust-version in Cargo.toml; this job keeps that claim honest.
        toolchain: [stable, "1.87"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: unit, integration, and doctests
        run: cargo test --locked
      - name: benchmarks, run once each
        run: cargo test --locked --bench core

  test-s3:
    name: test (S3, MinIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: start MinIO and create the bucket
        run: docker compose up -d --wait
      - name: storage tests against S3
        run: cargo test --locked
        env:
          ITZMA_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      - name: MinIO logs
        if: failure()
        run: docker compose logs minio

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --locked
          command: check --hide-inclusion-graph

  unused-deps:
    name: cargo-machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  python:
    name: python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # One cache per Python: target/ holds PyO3's view of the interpreter.
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: start MinIO and create the bucket
        run: docker compose up -d --wait
      - name: bridge crate tests, lint, Python tests (memory, file, MinIO)
        run: make py
        env:
          ITZMA_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      - name: MinIO logs
        if: failure()
        run: docker compose logs minio
