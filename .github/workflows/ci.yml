name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # New advisories land without any code change, so re-check weekly.
    - cron: "0 6 * * 1"
  # publish.yml runs the whole suite against the release tag before it
  # publishes anything.
  workflow_call:
    inputs:
      ref:
        description: The tag or commit to check out
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: release script tests
        run: make release-test
      - run: cargo clippy --locked --all-targets -- -D warnings
      # The store adapters are not default members (their SDKs need newer
      # Rust than the 1.87 floor), so each is named on its own.
      - run: cargo clippy --locked -p itzma-store-gcs --all-targets -- -D warnings
      - run: cargo clippy --locked -p itzma-store-azure --all-targets -- -D warnings
      - run: cargo clippy --locked -p itzma-store-aws --all-targets -- -D warnings
      - name: rustdoc
        run: cargo doc --locked --no-deps -p itzma-core
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.87 is the rust-version in Cargo.toml; this job keeps that claim honest.
        toolchain: [stable, "1.87"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: unit, integration, and doctests
        run: cargo test --locked
      - name: benchmarks, run once each
        run: cargo test --locked --bench core

  test-s3:
    name: test (S3, MinIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: start MinIO and create the bucket
        run: docker compose up -d --wait
      - name: storage tests against S3
        run: cargo test --locked
        env:
          ITZMA_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      - name: MinIO logs
        if: failure()
        run: docker compose logs minio

  test-gcs:
    name: test (GCS, storage-testbench)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: GCS adapter tests against storage-testbench
        run: make test-gcs
      - name: storage-testbench logs
        if: failure()
        run: docker compose --profile gcs logs gcs

  test-azure:
    name: test (Azure, Azurite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Azure adapter tests against Azurite
        run: make test-azure
      - name: Azurite logs
        if: failure()
        run: docker compose --profile azure logs azure

  test-aws:
    name: test (AWS, MinIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: AWS adapter tests against MinIO
        run: make test-aws
      - name: MinIO logs
        if: failure()
        run: docker compose logs minio

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --locked
          command: check --hide-inclusion-graph

  unused-deps:
    name: cargo-machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-machete
      - run: cargo machete

  python:
    name: python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      # One cache per Python: target/ holds PyO3's view of the interpreter.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: python-${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: start MinIO and create the bucket
        run: docker compose up -d --wait
      - name: start storage-testbench and create the bucket
        run: make gcs-up
      - name: start Azurite and create the container
        run: make azure-up
      - name: bridge crate tests, lint, Python tests (memory, file, MinIO, GCS, Azure)
        run: make py
        env:
          ITZMA_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          ITZMA_TEST_GCS_ENDPOINT: http://127.0.0.1:9100
          ITZMA_TEST_GCS_CONTROL_ENDPOINT: http://127.0.0.1:9101
          ITZMA_TEST_AZURE_ENDPOINT: http://127.0.0.1:10000/devstoreaccount1
      - name: MinIO logs
        if: failure()
        run: docker compose logs minio
