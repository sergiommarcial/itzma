name: Branch

# A quick check on every push to a work branch: formatting, then the
# workspace's tests minus the Python bridge (its test binary needs libpython;
# the full CI on the pull request covers it). Tests that need a storage
# emulator skip themselves here, since no endpoint is set.

on:
  push:
    branches-ignore: [main, "dependabot/**"]

permissions:
  contents: read

concurrency:
  group: branch-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace --exclude itzma-python
