name: Branch

# A quick check on every push to a work branch: formatting, then the
# workspace's tests minus the Python bridge (its test binary needs libpython;
# the full CI on the pull request covers it). Tests that need a storage
# emulator skip themselves here, since no endpoint is set.
#
# The lock is resolved first and the tests run on it, so a branch that adds a
# dependency gets a full run and the resolved Cargo.lock as an artifact to
# commit; the last step fails until the committed lock matches.

on:
  push:
    branches-ignore: [main, "dependabot/**"]

permissions:
  contents: read

concurrency:
  group: branch-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: resolve Cargo.lock
        run: cargo metadata --format-version 1 > /dev/null
      - run: cargo fmt --all --check
      - run: cargo test --workspace --exclude itzma-python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cargo-lock
          path: Cargo.lock
      - name: Cargo.lock is committed as resolved
        run: git diff --exit-code Cargo.lock
