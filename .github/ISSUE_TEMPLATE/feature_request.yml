name: Feature request
description: Something itzma should do but doesn't
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and where itzma gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: How it could work, if you have an idea. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: Workarounds you use now, or other tools you looked at.
