[package]
name = "itzma-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for itzma-core, built by maturin as itzma._itzma"
publish = false

[lib]
name = "_itzma"
crate-type = ["cdylib", "rlib"]

[features]
# maturin turns this on for the real extension build. `cargo test` leaves it
# off so the test binary links libpython and can run.
extension-module = ["pyo3/extension-module"]

[dependencies]
# Arrow in and out through the PyCapsule interface (pyarrow, Polars, DuckDB).
# pyo3-arrow 0.19 is built on the same pyo3 0.29 and numpy 0.29.
arrow-array = "59"
arrow-cast = "59"
arrow-schema = "59"
# Exact pin: the wheel and the crate are released together, and
# scripts/release.py moves this with the workspace version.
itzma-core = { path = "../itzma-core", version = "=0.1.0" }
# The Arrow reader becomes a `Stream` of batches for `upsert_stream`. Already
# in the tree through itzma-core and pyo3-async-runtimes.
futures = "0.3"
# The S3 backend is a real dependency here, unlike in itzma-core.
numpy = "0.29"
object_store = { version = "0.14", features = ["aws"] }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
# No default features: its buffer protocol needs the Python 3.11 limited API, and
# the extension is abi3-py310.
pyo3-arrow = { version = "0.19", default-features = false }
# Only the `generic` module: the bridge supplies its own per-process runtime.
pyo3-async-runtimes = "0.29"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }

[dev-dependencies]
tempfile = "3"
