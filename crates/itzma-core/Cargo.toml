[package]
name = "itzma-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Vector search on object storage: an embedded library, no server, just your bucket"
readme = "README.md"
keywords = ["vector-search", "object-storage", "hnsw", "embeddings", "s3"]
categories = ["database-implementations", "data-structures"]

[dependencies]
# Needed to implement `ObjectStore` for `CacheStore` (cache.rs) and the
# fault-injecting test store.
async-trait = "0.1"
bytes = "1"
futures = "0.3"
# The RAM tier of the tiered read cache (cache.rs). Bounds by entry
# count, not bytes, so CacheStore tracks used bytes itself. At least 0.18.2,
# which fixes RUSTSEC-2026-0002 and RUSTSEC-2026-0253.
lru = "0.19.0"
object_store = "0.14"
# The compute pools (cpu.rs): CPU work runs off the tokio workers.
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The streaming ingest's channel (stream.rs). Already in the tree through
# object_store; only the sync primitives are used.
tokio = { version = "1", default-features = false, features = ["sync"] }
thiserror = "2"
# C-backed ZSTD for WAL objects. Default features are legacy-format
# support and dictionary training, neither of which is used.
zstd = { version = "0.14", default-features = false }

[dev-dependencies]
# `aws` is only for the S3 test backend in tests/common; the library itself
# takes any ObjectStore and does not depend on it.
object_store = { version = "0.14", features = ["aws"] }
# For cache.rs's tests, which build an ObjectMeta by hand.
chrono = "0.4"
tempfile = "3"
# Timings in benches/core.rs. Default features add plotting and rayon, neither
# of which is used.
criterion = { version = "0.8", default-features = false, features = ["async_tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "core"
harness = false
